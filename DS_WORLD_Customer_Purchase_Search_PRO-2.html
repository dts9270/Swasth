*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eef5ff 0,#f8fafc 38%,#f4f7fb 100%);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}

const MONTHS=[['May','मे'],['June','जून'],['July','जुलै'],['August','ऑगस्ट'],['September','सप्टेंबर'],['October','ऑक्टोबर']];
const CURRENT='October';
const q=document.getElementById('q'), suggestions=document.getElementById('suggestions'), result=document.getElementById('result'), empty=document.getElementById('empty');
const personName=document.getElementById('personName'), personId=document.getElementById('personId'), monthsBox=document.getElementById('months');
const totalValue=document.getElementById('totalValue'), avgValue=document.getElementById('avgValue'), statusValue=document.getElementById('statusValue'), lastValue=document.getElementById('lastValue'), purchaseAlert=document.getElementById('purchaseAlert');
const toast=document.getElementById('toast'); let current=null;
function norm(s){return String(s??'').toLowerCase().replace(/\s+/g,' ').trim()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function fmt(v){return Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function score(r,t){const n=norm(r.name),id=norm(r.id),m=norm(r.mobile);if(id===t||m===t)return 120;if(n===t)return 110;if(id.startsWith(t)||m.startsWith(t))return 95;if(n.startsWith(t))return 90;if(id.includes(t)||m.includes(t))return 75;if(n.includes(t))return 70;return 0}
function getMatches(t){if(!t)return[];return DATA.map(r=>[score(r,t),r]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]||a[1].name.localeCompare(b[1].name)).slice(0,15).map(x=>x[1])}
function maskedMobile(m){const s=String(m||'');return s.length>=4?'••••••'+s.slice(-4):s}
function renderSuggestions(list){if(!list.length){suggestions.classList.remove('show');suggestions.innerHTML='';return}suggestions.innerHTML=list.map((r,i)=>`<div class="suggestion" data-i="${i}"><div class="sname">${escapeHtml(r.name)}</div><div class="smeta">RCM ID: ${escapeHtml(r.id)} • Mobile: ${escapeHtml(maskedMobile(r.mobile))}</div></div>`).join('');suggestions.classList.add('show');[...suggestions.children].forEach((el,i)=>el.onclick=()=>showPerson(list[i]));}
function calcStatus(r){const vals=MONTHS.map(([k])=>Number(r[k]||0));const active=vals.filter(v=>v>0).length;const recent3=vals.slice(-3);let label,cls;if(active>=5){label='Regular';cls='regular'}else if(recent3.every(v=>v===0)){label='Inactive';cls='inactive'}else{label='Irregular';cls='irregular'}return{label,cls,active,vals};}
function lastPurchase(r){for(let i=MONTHS.length-1;i>=0;i--){const [k,label]=MONTHS[i];if(Number(r[k]||0)>0)return label}return 'खरेदी नाही'}

function showPerson(r){current=r;q.value=r.name;personName.textContent=r.name;personId.textContent=r.id;const vals=MONTHS.map(([k])=>Number(r[k]||0));const total=vals.reduce((a,b)=>a+b,0);totalValue.textContent=fmt(total);avgValue.textContent=fmt(total/6);const st=calcStatus(r);statusValue.textContent=st.label;statusValue.className='statValue status '+st.cls;lastValue.textContent='शेवटची खरेदी: '+lastPurchase(r);showAlert(r);monthsBox.innerHTML=MONTHS.map(([k,label])=>`<div class="mrow ${k===CURRENT?'current':''}"><div class="mname">${label}</div><div class="mval ${Number(r[k]||0)===0?'zero':''}">${fmt(r[k])}</div></div>`).join('');suggestions.classList.remove('show');empty.classList.remove('show');result.classList.add('show');q.blur();}
function searchNow(){const t=norm(q.value);result.classList.remove('show');empty.classList.remove('show');current=null;if(!t){renderSuggestions([]);return}const list=getMatches(t);if(list.length===1&&(norm(list[0].id)===t||norm(list[0].mobile)===t||norm(list[0].name)===t)){showPerson(list[0]);return}if(!list.length){renderSuggestions([]);empty.classList.add('show');return}renderSuggestions(list)}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}
async function copyText(txt,msg){try{await navigator.clipboard.writeText(txt)}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}showToast(msg)}
function summaryText(r){const total=MONTHS.reduce((s,[k])=>s+Number(r[k]||0),0);return `${r.name}\nRCM ID: ${r.id}\n${MONTHS.map(([k,l])=>`${l}: ${fmt(r[k])}`).join('\n')}\n6 Month Total: ${fmt(total)}`}
q.addEventListener('input',searchNow);q.addEventListener('keydown',e=>{if(e.key==='Enter'){const list=getMatches(norm(q.value));if(list[0])showPerson(list[0]);else{renderSuggestions([]);empty.classList.add('show')}}});
